<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Albus Agent</title>
    <!-- CSP Directive -->
    <!--
      No `frame-src` here on purpose, not an oversight: it is left unset so it
      falls back to `default-src 'self'`, and a `sandbox=""` `<iframe srcDoc>`
      (used by ExternalAgentPanel to preview a hub agent's `.html` report)
      is matched against the EMBEDDING document's own URL, not an external
      one — `about:srcdoc` has no origin of its own to check against
      `frame-src`. `default-src 'self'` already permits it; adding an
      explicit `frame-src` here would only narrow things if it ever diverged
      from `default-src`, so it stays implicit. That iframe's unique opaque
      origin (no `allow-same-origin`) ALSO inherits this page's CSP for its
      own resource loads, so `img-src 'self' data:` blocks a report from
      phoning home for a remote image even though sandboxing itself does not.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
